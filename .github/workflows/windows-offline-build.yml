name: Techmo Windows
# buildcheck-trigger: runtime-recovery-stub

on:
  workflow_dispatch:
  push:
    branches: [main, "experiment/**"]
    paths:
      - "engine/runtime/**"
      - "engine/address_space.h"
      - "engine/renderer/**"
      - "third_party/**"
      - "tests/**"
      - "scripts/**"
      - "tools/**"
      - "apps/launcher/**"
      - "build.sh"
      - "run.bat"
      - "setup.bat"
      - ".gitattributes"
      - ".github/workflows/windows-offline-build.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            curl
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-miniupnpc

      - name: Build Techmo runtime
        shell: msys2 {0}
        run: |
          export CC=clang
          export CXX=clang++
          set +e
          bash build.sh --test
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "===== extended GPU build failure context ====="
            tail -n 180 out/gpu-build.log || true
            exit "$rc"
          fi

      - name: Build and run precache regression tests
        shell: msys2 {0}
        run: |
          set -e
          ninja -C out/gpu memory-pressure-test pipeline-cache-blob-test pipeline-archive-test motion-history-test motion-shader-test image-overlap-test settings-test ui-composition-test engine-hooks-test engine-menu-memory-test rebirth-refund-test pc-input-test pc-input-bridge-test widescreen-test
          out/gpu/memory-pressure-test.exe
          out/gpu/pipeline-cache-blob-test.exe
          out/gpu/pipeline-archive-test.exe
          out/gpu/motion-history-test.exe
          out/gpu/motion-shader-test.exe
          out/gpu/image-overlap-test.exe
          out/gpu/settings-test.exe
          ninja -C out/gpu -j2 performance-monitor-test performance-monitor-gpu-test
          out/gpu/performance-monitor-test.exe
          out/gpu/ui-composition-test.exe
          out/gpu/engine-hooks-test.exe
          out/gpu/engine-menu-memory-test.exe
          out/gpu/rebirth-refund-test.exe
          out/gpu/pc-input-test.exe
          out/gpu/pc-input-bridge-test.exe
          out/gpu/widescreen-test.exe

      - name: Build and run pipeline preparation regressions
        shell: msys2 {0}
        run: |
          set -e
          ninja -C out/gpu -j2 pipeline-precompiler-test pipeline-key-test liverpool-tasks-test pipeline-precompile-gpu-test buffer-access-test shader-memory-test hdr-shader-test
          out/gpu/pipeline-precompiler-test.exe
          out/gpu/pipeline-key-test.exe
          out/gpu/liverpool-tasks-test.exe
          mkdir -p out/shader-memory-tests
          out/gpu/shader-memory-test.exe out/shader-memory-tests
          for file in out/shader-memory-tests/*.spv; do spirv-val --target-env vulkan1.3 "$file"; done
          # The real Vulkan readback fixture is compiled here and run locally on a GPU.

      - name: Verify depth, indirect IDs and texture cache semantics
        shell: msys2 {0}
        run: |
          set -e
          ninja -C out/gpu -j2 render-semantics-test image-layout-cache-test lru-cache-test
          mkdir -p out/render-semantics-tests
          out/gpu/render-semantics-test.exe out/render-semantics-tests
          out/gpu/image-layout-cache-test.exe
          out/gpu/lru-cache-test.exe
          for file in out/render-semantics-tests/*.spv; do spirv-val --target-env vulkan1.3 "$file"; done

      - name: Build and run recording, memory and frame pacing regressions
        # CPU ownership/remapping checks run on hosted Windows; GPU readback runs locally.
        shell: msys2 {0}
        run: |
          set -e
          ninja -C out/gpu -j2 record-data-test memory-notifications-test frame-pacing-test ngx-lifetime-test stable-arena-test image-hash-test tiled-writeback-test tiled-gc-test
          BB_COPY_THREADS=0 out/gpu/image-hash-test.exe
          BB_COPY_THREADS=2 out/gpu/image-hash-test.exe
          out/gpu/record-data-test.exe --cpu-only
          out/gpu/memory-notifications-test.exe
          out/gpu/frame-pacing-test.exe
          for fps in 30 60 90 0; do
            hz=60
            if [ "$fps" = 90 ]; then hz=90; fi
            if [ "$fps" = 0 ]; then hz=480; fi
            for mode in Mailbox Immediate Fifo FifoRelaxed; do
              BB_FPS_LIMIT="$fps" BB_VBLANK_HZ="$hz" BB_PRESENT_MODE="$mode" out/gpu/frame-pacing-test.exe --settings "$fps" "$mode"
            done
          done
          # NGX fixture compiles here; fake/real feature lifecycle runs locally on Vulkan.

      - name: Verify preparation, patches, and mod safety
        shell: msys2 {0}
        run: |
          python -m unittest discover -s tests -p 'test_prepare.py'
          python -m unittest discover -s tests -p 'test_patches.py'
          python -m unittest discover -s tests -p 'test_render_pools.py'
          python -m unittest discover -s tests -p 'test_memory_preflight.py'
          python -m unittest discover -s tests -p 'test_game_check.py'
          python -m unittest discover -s tests -p 'test_windows_frame_rate.py'
          python -m unittest discover -s tests -p 'test_high_frame_rate.py'
          python -m unittest discover -s tests -p 'test_engine_assets.py'
          python -m unittest discover -s tests -p 'test_mods.py'
          python -m unittest discover -s tests -p 'test_online.py'
          python -m unittest discover -s tests -p 'test_upscaler_assets.py'
          python -m unittest discover -s tests -p 'test_fsr4cap_dll_info.py'
          python -m unittest discover -s tests -p 'test_session_diagnostics.py'
          python -m unittest discover -s tests -p 'test_red_zone.py'
          python -m unittest discover -s tests -p 'test_native_package.py'

      - name: Fetch DLSS 310.9.1
        shell: msys2 {0}
        run: bash tools/fetch_dlss.sh out

      - name: Fetch FSR 4 v07 assets
        shell: msys2 {0}
        run: |
          set +e
          bash tools/fetch_fsr4_assets.sh
          fetch_status=$?
          set -e
          count=$(find fsr4_shaders -type f 2>/dev/null | wc -l)
          echo "FSR4 asset files: $count (fetch/optimizer status: $fetch_status)"
          test "$count" -ge 180

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Locate MSYS2 for launcher verification
        # The launcher catalog uses the same Python loader as game startup.
        # Publish the actual MSYS2 location rather than assuming C:\msys64 on runners.
        # This value is only used during verification/building.
        shell: msys2 {0}
        run: echo "BB_MSYS2=$(cygpath -w /)" >> "$GITHUB_ENV"

      - name: Verify launcher UI, mods and lifecycle
        shell: pwsh
        run: ./apps/launcher/Verify-Launcher.ps1 -PreviewDirectory launcher-previews

      - name: Publish launcher
        shell: pwsh
        run: dotnet publish apps/launcher/Techmo.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o launcher-publish

      - name: Setup portable Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download embeddable Python
        shell: pwsh
        run: |
          $ver = python -c "import platform; print(platform.python_version())"
          $url = "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip"
          New-Item -ItemType Directory -Force -Path package/tools/python | Out-Null
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath package/tools/python -Force
          $pth = Get-ChildItem package/tools/python/python*._pth | Select-Object -First 1
          if ($pth) { Add-Content $pth.FullName "..\..\scripts" }

      - name: Assemble portable test package
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p package/out package/scripts package/patches package/mods package/launcher-assets
          cp -f launcher-publish/Techmo.Launcher.exe package/
          cp -f run.bat build.sh package/
          cp -f out/bb-probe.exe out/bb-gpu-capabilities.exe out/bb-engine-assets.exe out/bb-crash-reporter.exe out/native-build.json package/out/
          cp -f apps/launcher/Assets/bloodborne.ico package/out/
          test ! -f out/nvngx_dlss.dll || cp -f out/nvngx_dlss.dll package/out/
          cp -rf scripts/* package/scripts/
          mkdir -p package/tools/experiments
          cp -f tools/experiments/test-vram-writeback.cmd package/tools/experiments/
          test ! -d patches || cp -rf patches/* package/patches/
          test ! -d fsr4_shaders || cp -rf fsr4_shaders package/
          for document in LICENSE LICENSING.md NOTICE.md DEPENDENCIES.md THIRD_PARTY_NOTICES.txt; do
            test ! -f "$document" || cp -f "$document" package/
          done
          test ! -d licenses || cp -rf licenses package/
          mkdir -p package/licenses/msys2
          cp -rf /clang64/share/licenses/. package/licenses/msys2/
          test ! -f README.md || cp -f README.md package/
          # build.sh already collects the recursive toolchain DLL closure in out/.
          # Copy it directly; GitHub's MSYS2 installation path varies by runner.
          cp -f out/*.dll package/out/
          python tools/verify_native_package.py package/out
          cat > package/README-FIRST.txt <<'EOF'
          Techmo Bloodborne - experimental Windows build

          1. Run Techmo.Launcher.exe.
          2. Select your own Bloodborne v1.09 game dump (folder containing eboot.bin and sce_sys).
            3. Configure Display (resolution, FPS and Present mode), Graphics and Controls.
               Apply changes saves the selected profile. Save a copy creates a named profile.
               Unlimited FPS is experimental; title/loading screens remain limited to 60 FPS.
          4. Press PLAY BLOODBORNE.

          The launcher uses artwork from your own game sce_sys folder when available.
          Online is optional. In ONLINE, enter your own shadNet host, TCP port and WebAPI
          URL, sign in with the account created on that server's website, and save.
          The game host override is generated automatically. No server is configured by default.
          Multiplayer between two clients requires separate validation.

          FSR 4.1.1 requires its separate asset set; this package includes FSR 4 v07,
          FSR 3.1 and DLSS Super Resolution 310.9.1.
          EOF

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Techmo-Bloodborne-Windows-${{ github.sha }}
          path: package/
          compression-level: 6
          if-no-files-found: error
